name: Reproduce bounded SOVENGI memory training
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sovengi-memory-training-20261013
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Clean, frozen preparation revision; the current tree already has the corpus.
          ref: 9dd39f55be335b924881d10445cfc78a288e483e
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[conversation]'
      - name: Verify experiment data isolation
        run: python -m unittest discover -s tests -p test_sovengi_memory_training.py -v
      - name: Train the pinned own model and compare real replies
        run: python -u examples/train_sovengi_memory.py
      - name: Preserve resumable checkpoints, frozen corpus and raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovengi-memory-training-${{ github.run_id }}
          retention-days: 90
          path: |
            private/sovengi-memory-20261013/
            examples/sovengi-memory-20261013/
            docs/sovengi-memory-20261013/
            models/sovengi-memory-20261013/
