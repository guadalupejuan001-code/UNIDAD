name: Verify SOVENGI brain and models
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: unidad --help
  conversation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[conversation,mobile]'
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s examples -p 'test_*.py' -v
      - run: unidad conversation --help
      - run: sovengi --help
      - name: Verify SOVENGI with the selected published weights
        run: python examples/verify_sovengi.py --output private/sovengi-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: sovengi-verification
          path: private/sovengi-verification.json
