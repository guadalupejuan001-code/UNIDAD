name: Train an explicit SOVENGI continuation stage
on:
  workflow_dispatch:
    inputs:
      stage_config:
        description: Tracked configuration of a new, unevaluated stage with a pinned own-weight parent
        required: true
        default: configs/sovengi-dialogue-stage.json
        type: string
permissions:
  contents: read
concurrency:
  # Share the existing memory workflow lock: no overlapping cloud trainers.
  group: sovengi-memory-training-20261013
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGE_CONFIG: ${{ inputs.stage_config }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            tests
            configs
            examples
            docs
            models
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[conversation]'
      - name: Check dataset boundaries
        run: PYTHONPATH=src:tests python -m unittest test_sovengi_continuation test_sovengi_memory_training -v
      - name: Train the declared next stage and preserve real replies
        run: python -u examples/train_sovengi_continuation.py --config "$STAGE_CONFIG"
      - name: Preserve checkpoints and evidence even if interrupted
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovengi-continuation-${{ github.run_id }}
          retention-days: 90
          path: |
            private/sovengi-*/run/
            docs/sovengi-*/
            examples/sovengi-*/
            models/sovengi-*/
            configs/sovengi-*.json
