[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unidad"
version = "0.6.0"
description = "Cerebro reutilizable con modelos propios, memoria y herramientas por producto"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5"]

[project.optional-dependencies]
conversation = ["torch==2.8.0", "tokenizers==0.22.2", "safetensors==0.7.0"]
mobile = ["onnx==1.17.0", "onnxruntime==1.20.0"]

[project.scripts]
unidad = "ia_propia.cli:main"
ia-propia = "ia_propia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ia_propia.assets" = ["*.json", "nerva/*.mjs", "nerva/*.nv"]
