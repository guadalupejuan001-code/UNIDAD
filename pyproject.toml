[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-propia"
version = "0.1.0"
description = "Base experimental de modelos propios y encargos con contexto revisable"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5"]

[project.scripts]
ia-propia = "ia_propia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
